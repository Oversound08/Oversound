.os-header nav a{transition:background .2s,transform .2s}.os-header nav a:hover{transform:translateY(-1px)}
.os-aiuto{background:linear-gradient(135deg,#18181b,#0a0a0b)!important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}.os-spark{color:var(--os-r);margin-right:2px}
/* hero */
.os-hero{border-radius:28px;box-shadow:0 30px 60px -30px rgba(10,10,11,.55);isolation:isolate}
.os-hero>a{transition:transform .9s var(--os-ease)}.os-hero:hover>a img,.os-hero:hover>a video{transform:scale(1.03)}.os-hero img,.os-hero video{transition:transform 1.2s var(--os-ease)}
.os-hero-ov{background:linear-gradient(100deg,rgba(10,10,11,.88) 0%,rgba(10,10,11,.55) 38%,rgba(10,10,11,0) 70%),linear-gradient(to top,rgba(10,10,11,.55),transparent 55%)!important}
.os-hero-t{font-size:clamp(28px,5.2vw,64px)!important;line-height:.98;letter-spacing:-.045em;text-wrap:balance;max-width:16ch!important}
.os-hero-x{color:#d4d4d8;font-size:clamp(14px,1.5vw,18px)!important;margin-top:10px!important}
.os-cta{display:inline-flex;align-items:center;gap:8px;padding:12px 22px!important;font-size:15px!important;box-shadow:0 10px 30px -8px rgba(225,6,0,.7);transition:gap .25s,background .2s;margin-top:20px!important}
.os-hero:hover .os-cta{gap:14px;background:var(--os-r2)}
.os-glass{background:rgba(255,255,255,.14)!important;color:#fff;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.25)!important;padding:10px!important;transition:background .2s}
.os-glass:hover{background:rgba(255,255,255,.28)!important}.os-hero>button.os-glass{top:auto!important;bottom:18px;transform:none!important;left:auto!important}.os-hero>button.os-glass[aria-label=Precedente]{right:70px!important}.os-hero>button.os-glass[aria-label=Successiva]{right:20px!important}.os-hero>div.absolute{top:22px;right:24px!important;bottom:auto!important}
.os-dot{transition:width .4s var(--os-ease),background .3s}.os-dot.on{position:relative;overflow:hidden;background:rgba(255,255,255,.35)!important;width:34px!important}
.os-dot.on::after{content:"";position:absolute;inset:0;background:var(--os-r);transform-origin:left;animation:os-bar 5s linear forwards}
.os-hero:hover .os-dot.on::after{animation-play-state:paused}
@keyframes os-bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
/* etichette di sezione */
.os-eyebrow{display:inline-flex;align-items:center;gap:8px;font:600 11.5px/1 "Inter",system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--os-r);margin-bottom:8px}
.os-eyebrow::before{content:"";width:18px;height:2px;border-radius:2px;background:currentColor}
.os-eyebrow-l{color:#fff;opacity:.92}.os-eyebrow-l::before{background:var(--os-r)}
.os-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}.os-h h2{font-size:clamp(24px,3vw,34px)!important;font-weight:800!important;margin:0!important;line-height:1.05}
.os-more{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px;color:var(--os-r);white-space:nowrap;transition:gap .2s}.os-more:hover{gap:11px}
/* nastro scorrevole */
.os-marquee{margin:22px -16px 0;overflow:hidden;border-block:1px solid var(--os-line);padding:14px 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.os-mq{display:flex;width:max-content;animation:os-mq 38s linear infinite}.os-mq>span{display:flex}
.os-mq b{display:inline-flex;align-items:center;gap:22px;padding-right:22px;font:800 clamp(18px,2.4vw,28px)/1 "Archivo",system-ui,sans-serif;letter-spacing:-.02em;text-transform:uppercase;color:transparent;-webkit-text-stroke:1.2px #18181b;white-space:nowrap}
.os-mq b:nth-child(3n+1){color:var(--os-ink);-webkit-text-stroke:0}.os-mq i{font-style:normal;color:var(--os-r);-webkit-text-stroke:0;font-size:.6em}
.os-marquee:hover .os-mq{animation-play-state:paused}
@keyframes os-mq{to{transform:translateX(-50%)}}
/* tab prodotti a pillola */
.os-tabs{background:var(--os-soft);padding:4px;border-radius:999px;gap:2px!important}.os-tabs button{background:transparent!important;color:var(--os-mut);transition:background .25s,color .25s,box-shadow .25s}
.os-tabs button.on{background:var(--os-k)!important;color:#fff!important;box-shadow:0 6px 16px -6px rgba(0,0,0,.4)}.os-tabs button:not(.on):hover{color:var(--os-ink)}
/* schede prodotto */
.os-card{border-radius:20px!important;border-color:var(--os-line)!important;background:#fff;transition:transform .35s var(--os-ease),box-shadow .35s,border-color .3s!important}
.os-card:hover{transform:translateY(-5px)!important;border-color:transparent!important;box-shadow:0 24px 48px -24px rgba(10,10,11,.35),0 0 0 1px rgba(10,10,11,.04)!important}
.os-media{background:var(--os-soft)!important;margin:6px 6px 0;border-radius:15px;overflow:hidden}
.os-media .foto-intera{background:transparent;mix-blend-mode:multiply}
.os-media img{transition:transform .6s var(--os-ease)}.os-card:hover .os-media img{transform:scale(1.06)}
.os-media>span{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);letter-spacing:.02em}
.os-fav{top:14px!important;right:14px!important;background:rgba(255,255,255,.85)!important;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 4px 12px -4px rgba(0,0,0,.2)!important;transition:transform .2s}.os-fav:hover{transform:scale(1.1)}
.os-card s{white-space:nowrap}@media (max-width:640px){.os-card s{display:block;margin:0 0 1px}}.os-price{font-family:"Archivo","Inter",sans-serif;font-weight:800;letter-spacing:-.02em;font-size:19px!important}
.os-add{padding:10px!important;box-shadow:0 8px 18px -8px rgba(225,6,0,.8);transition:transform .25s var(--os-ease),background .2s}.os-card:hover .os-add:not(:disabled){transform:scale(1.08) rotate(-4deg)}
/* servizi */
.os-serv{position:relative;overflow:hidden;border-radius:24px!important;background:var(--os-k);color:#fff;border-color:#1f1f23!important;padding:28px!important;min-height:220px;transition:transform .35s var(--os-ease),box-shadow .35s}
.os-serv::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(closest-side,rgba(225,6,0,.55),transparent);transition:transform .5s var(--os-ease)}
.os-serv:hover{transform:translateY(-4px);box-shadow:0 30px 50px -28px rgba(225,6,0,.55)}.os-serv:hover::after{transform:scale(1.35)}
.os-serv h3{font-size:21px!important;position:relative;z-index:1}.os-serv p{color:#a1a1aa!important;position:relative;z-index:1}.os-serv .os-more{margin-top:auto!important;padding-top:18px;color:#fff;position:relative;z-index:1}.os-serv .os-more span{color:var(--os-r)}
.os-num{position:relative;z-index:1;font:800 13px/1 "Archivo",sans-serif;letter-spacing:.1em;color:var(--os-r);margin-bottom:26px;display:inline-block;align-self:flex-start;padding:6px 10px;border:1px solid rgba(225,6,0,.45);border-radius:999px}
/* «Non sai cosa scegliere?» con luci da palco */
.os-trova{border-radius:28px!important;padding:clamp(28px,5vw,64px)!important;background:radial-gradient(120% 140% at 100% 0%,#2a0503 0%,#0a0a0b 55%)!important}
.os-trova>*{position:relative;z-index:1}.os-trova h2{font-size:clamp(28px,4.4vw,52px)!important;max-width:14ch;line-height:1}
.os-trova .os-beam{position:absolute;z-index:0;top:-40%;right:12%;width:180px;height:180%;background:linear-gradient(180deg,rgba(225,6,0,.55),rgba(225,6,0,0) 70%);filter:blur(18px);transform:rotate(22deg);transform-origin:top;animation:os-beam 7s ease-in-out infinite alternate;pointer-events:none}
.os-trova .os-beam.b2{right:32%;width:110px;opacity:.6;animation-duration:9s;animation-delay:-3s;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 65%)}
@keyframes os-beam{from{transform:rotate(14deg)}to{transform:rotate(32deg)}}
.os-trova a{box-shadow:0 12px 30px -10px rgba(225,6,0,.75);transition:transform .25s}.os-trova a:hover{transform:translateY(-2px)}
/* vantaggi */
.os-trust{background:#fff!important;border:1px solid var(--os-line);border-radius:18px!important;padding:18px!important;align-items:flex-start;transition:border-color .25s,transform .3s var(--os-ease)}.os-trust:hover{border-color:rgba(225,6,0,.35);transform:translateY(-2px)}
.os-ti{display:grid;place-items:center;flex:none;width:44px;height:44px;border-radius:13px;background:rgba(225,6,0,.08)}
/* newsletter */
.os-news{border-radius:28px!important;padding:clamp(28px,5vw,56px)!important;background:linear-gradient(120deg,#e10600 0%,#c40500 55%,#8f0400 100%)!important}
.os-news>*:not(.os-wave){position:relative;z-index:1}.os-news .os-eyebrow-l::before{background:#fff}.os-news h2{font-size:clamp(26px,3.6vw,42px)!important;line-height:1.02}
.os-news input{background:rgba(255,255,255,.96);padding:12px 18px!important}.os-news button{padding:12px 22px!important;transition:transform .2s}.os-news button:hover{transform:translateY(-1px)}
.os-wave{position:absolute;right:-4%;bottom:-8%;width:52%;height:75%;opacity:.2;fill:none;stroke:#fff;stroke-width:2;z-index:0}
.os-wave path:nth-child(2){opacity:.6;animation:os-wv 6s ease-in-out infinite alternate}@keyframes os-wv{to{transform:translateY(8px)}}
/* piè di pagina */
.os-footer{position:relative;background:#0a0a0b!important}.os-footer::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--os-r),transparent)}
.os-footer h2{font-size:12px!important;letter-spacing:.14em;text-transform:uppercase;color:#a1a1aa!important}
/* barra in basso (telefono) */
.tabbar{background:rgba(255,255,255,.86)!important;-webkit-backdrop-filter:saturate(1.6) blur(16px)!important;backdrop-filter:saturate(1.6) blur(16px)!important;border-top-color:rgba(0,0,0,.06)!important}
.tabbar a.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--os-r)}
/* pulsanti e campi in tutto il sito */
.bg-brand{transition:background-color .2s,transform .2s,box-shadow .2s}
a.bg-brand:hover,button.bg-brand:not(:disabled):hover{box-shadow:0 10px 24px -10px rgba(225,6,0,.75)}
.rounded-2xl{border-radius:22px}
/* comparsa morbida delle sezioni mentre scorri (solo browser che lo supportano) */
@supports (animation-timeline:view()){.os-rv{animation:os-in both var(--os-ease);animation-timeline:view();animation-range:entry 0% entry 35%}@keyframes os-in{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}}
/* foto prodotto da sfogliare */
.gal-tr{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}.gal-tr::-webkit-scrollbar{display:none}
.gal-it{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always}
.gal-b{position:absolute;top:50%;transform:translateY(-50%);display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 4px 14px -4px rgba(0,0,0,.25);transition:opacity .2s}.gal-b.l{left:10px}.gal-b.r{right:10px}.gal-b:disabled{opacity:0;pointer-events:none}
.gal-n{position:absolute;top:12px;left:12px;background:rgba(10,10,11,.7);color:#fff;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px}
.gal-d{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:5px}.gal-d i{width:6px;height:6px;border-radius:3px;background:rgba(10,10,11,.25);transition:width .25s,background .25s}.gal-d i.on{width:18px;background:var(--os-r)}
@media (hover:none){.gal-b{display:none}}
/* pagina della slide */
.sl-tit{margin:22px 0 4px}.sl-tit h1{font:800 clamp(28px,4.5vw,48px)/1.05 "Archivo","Inter",sans-serif;letter-spacing:-.035em}.sl-tit p{margin-top:8px;color:var(--os-mut);font-size:18px}
.sl-testo{max-width:720px;margin:28px auto 0;font-size:17.5px;line-height:1.75;color:#27272a}.sl-testo p{margin:0 0 18px}.sl-testo h2{font:800 24px/1.2 "Archivo",sans-serif;letter-spacing:-.02em;margin:32px 0 12px;color:var(--os-ink)}
.sl-fig{margin:26px 0}.sl-fig button,.sl-gal button{display:block;width:100%;padding:0;cursor:zoom-in}.sl-fig img{width:100%;border-radius:18px}.sl-fig figcaption{font-size:14px;color:var(--os-mut);margin-top:8px;text-align:center}
.sl-gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:24px 0}.sl-gal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;transition:transform .3s}.sl-gal button:hover img{transform:scale(1.02)}
.sl-prod{margin-top:44px;scroll-margin-top:150px}
.sl-vai{position:fixed;z-index:35;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;width:min(560px,calc(100% - 24px));padding:10px 10px 10px 18px;border-radius:999px;background:rgba(10,10,11,.92);color:#e4e4e7;font-size:14px;box-shadow:0 18px 40px -14px rgba(0,0,0,.55);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:transform .35s var(--os-ease),opacity .3s}
.sl-vai span{flex:1;min-width:0}.sl-vai b{color:#fff}.sl-vai button{white-space:nowrap;letter-spacing:.03em;box-shadow:0 8px 20px -8px rgba(225,6,0,.9)}
.sl-vai.via{transform:translate(-50%,140%);opacity:0;pointer-events:none}
@media (max-width:767px){body:has(.sl-vai:not(.via)) a[aria-label="Scrivici su WhatsApp"]{bottom:calc(150px + env(safe-area-inset-bottom,0px))}.sl-vai{bottom:calc(72px + env(safe-area-inset-bottom,0px))}.sl-vai span{font-size:13px}.sl-testo{font-size:16.5px}}
.sl-lb{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:16px;cursor:zoom-out}.sl-lb img{max-width:100%;max-height:100%;border-radius:10px}.sl-lb button{position:absolute;top:14px;right:16px;color:#fff;font-size:26px}
@keyframes os-car{from{opacity:.55;transform:scale(.97)}to{opacity:1;transform:none}}
.os-logo{height:auto;width:clamp(170px,22vw,250px);max-width:100%;object-fit:contain}.os-logo-f{height:auto;width:240px;max-width:100%;padding:8px 10px}
/* app installabile */
.app-inv{position:fixed;z-index:45;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;border-radius:20px;background:#0a0a0b;color:#e4e4e7;border:1px solid rgba(255,255,255,.14);box-shadow:0 20px 40px -12px rgba(0,0,0,.5);font-size:13.5px;line-height:1.35;animation:app-su .4s var(--os-ease)}
.app-inv img{width:44px;height:44px;border-radius:11px;flex:none}.app-inv b{color:#fff;display:block;font-size:14.5px}.app-inv span{flex:1;min-width:0}
.app-inv .si{background:#e10600;color:#fff;font-weight:700;border-radius:999px;padding:9px 16px;white-space:nowrap}.app-inv .no{color:#a1a1aa;font-size:20px;padding:4px 6px}
@media (min-width:768px){.app-inv{left:auto;right:24px;bottom:24px;width:380px}}
@keyframes app-su{from{transform:translateY(30px);opacity:0}}
@media (display-mode:standalone){.annuncio{padding-top:calc(env(safe-area-inset-top,0px) + 6px)!important}}
@media (max-width:640px){.os-hero{border-radius:22px}.os-h{align-items:flex-start;flex-direction:column;gap:6px}.os-serv{min-height:0}.os-marquee{margin-top:16px}.os-hero-t{max-width:none!important}}
@media (prefers-reduced-motion:reduce){.os-mq,.os-beam,.os-dot.on::after,.annuncio::before,.os-wave path{animation:none!important}.os-rv{animation:none!important}}

/* fascia evento (layout del sito con giorni e promozione) */
#os-evento{--ev-acc:#ffc83d;position:relative;z-index:41;display:flex;align-items:center;justify-content:center;gap:10px 14px;flex-wrap:wrap;padding:9px 16px;background:linear-gradient(90deg,#050506,#1a0200 50%,#050506);color:#fff;font:600 13px/1.2 "Inter",system-ui,sans-serif;overflow:hidden;text-decoration:none}
#os-evento::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.09) 50%,transparent 70%);transform:translateX(-100%);animation:ev-luce 4.5s ease-in-out infinite;pointer-events:none}
@keyframes ev-luce{60%,100%{transform:translateX(100%)}}
#os-evento .ev-t{font:900 15px/1 "Archivo","Inter",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--ev-acc)}
#os-evento .ev-s{background:var(--os-r,#e10600);color:#fff;border-radius:999px;padding:4px 10px;font:800 13px/1 "Archivo","Inter",sans-serif}
#os-evento .ev-p{color:#d4d4d8}
#os-evento .ev-c{display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}#os-evento .ev-c:empty{display:none}
#os-evento .ev-c i{font-style:normal;color:#a1a1aa;margin-right:4px}
#os-evento .ev-c b{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:6px;padding:3px 6px;font:800 13px/1 "Archivo","Inter",sans-serif;min-width:34px;text-align:center}
#os-evento .ev-c small{font-size:10px;color:#a1a1aa;margin-left:1px}
#os-evento .ev-go{color:var(--ev-acc);font-weight:700}
@media (max-width:640px){#os-evento{gap:6px 10px;padding:8px 12px;font-size:12px}#os-evento .ev-go,#os-evento .ev-c i{display:none}#os-evento .ev-c b{min-width:28px;padding:3px 4px;font-size:12px}}
@media (prefers-reduced-motion:reduce){#os-evento::after{animation:none}}

/* apertura dell'app: logo animato */
#os-splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:radial-gradient(120% 80% at 50% 45%,#fff 0%,#fff 55%,#f4f4f5 100%);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.7,.2,1)}
#os-splash.via{opacity:0;transform:scale(1.08);pointer-events:none}
html.splash-on,html.splash-on body{overflow:hidden}
#os-splash .sp-c{position:relative;width:min(78vw,380px);display:grid;place-items:center}
#os-splash .sp-l{position:relative;z-index:2;width:100%;height:auto;animation:sp-logo 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes sp-logo{0%{opacity:0;transform:scale(.82);filter:blur(14px);clip-path:inset(0 100% 0 0)}55%{opacity:1;filter:blur(0);clip-path:inset(0 0 0 0)}75%{transform:scale(1.04)}100%{transform:scale(1);clip-path:inset(0 0 0 0)}}
#os-splash .sp-r{position:absolute;left:50%;top:46%;width:60%;aspect-ratio:1;border-radius:50%;border:2px solid #e10600;transform:translate(-50%,-50%) scale(.3);opacity:0;animation:sp-onda 1.8s ease-out .35s infinite}
#os-splash .sp-r:nth-child(2){animation-delay:.75s}#os-splash .sp-r:nth-child(3){animation-delay:1.15s}
@keyframes sp-onda{0%{opacity:.55;transform:translate(-50%,-50%) scale(.3)}100%{opacity:0;transform:translate(-50%,-50%) scale(2.1)}}
#os-splash .sp-eq{display:flex;align-items:flex-end;gap:5px;height:34px;margin-top:22px;opacity:0;animation:sp-in .4s ease .7s forwards}
#os-splash .sp-eq i{width:6px;height:100%;border-radius:3px;background:#0a0a0b;transform-origin:bottom;animation:sp-eq .55s ease-in-out infinite alternate}
#os-splash .sp-eq i:nth-child(odd){background:#e10600}
#os-splash .sp-eq i:nth-child(1){animation-delay:-.1s}#os-splash .sp-eq i:nth-child(2){animation-delay:-.35s}#os-splash .sp-eq i:nth-child(3){animation-delay:-.2s}#os-splash .sp-eq i:nth-child(4){animation-delay:-.5s}#os-splash .sp-eq i:nth-child(5){animation-delay:-.05s}#os-splash .sp-eq i:nth-child(6){animation-delay:-.4s}#os-splash .sp-eq i:nth-child(7){animation-delay:-.25s}
@keyframes sp-eq{from{transform:scaleY(.18)}to{transform:scaleY(1)}}
@keyframes sp-in{to{opacity:1}}
@media (prefers-reduced-motion:reduce){#os-splash *{animation:none!important;opacity:1!important}#os-splash .sp-r{display:none}}

.app-guida{position:fixed;inset:0;z-index:60;background:rgba(10,10,11,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;animation:gd-in .25s ease;transition:opacity .3s}
.app-guida.via{opacity:0}@keyframes gd-in{from{opacity:0}}
.app-guida .gs{position:relative;width:100%;max-width:440px;background:#fff;border-radius:26px 26px 0 0;padding:26px 20px calc(110px + env(safe-area-inset-bottom,0px));text-align:center;animation:app-su .35s var(--os-ease)}
